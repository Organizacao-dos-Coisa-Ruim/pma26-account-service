server:
  port: 8080
  tomcat:
    # publica métricas das threads do Tomcat (ocupadas / máximo), úteis no load test
    mbeanregistry:
      enabled: true

spring:
  application:
    name: account
  # Conexão com o Postgres vem de variáveis de ambiente (RDS em produção)
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_DB:store}
    username: ${DATABASE_USERNAME:store}
    password: ${DATABASE_PASSWORD}
  jpa:
    # quem cria o schema é o Flyway; o Hibernate só confere se bate com as entidades
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: account
  # Cada serviço usa um schema próprio dentro do mesmo banco
  flyway:
    schemas: account
    default-schema: account
    create-schemas: true

# Observabilidade: health e métricas no formato do Prometheus em /actuator/*.
# O gateway não roteia /actuator, então isso só é acessível pela rede interna.
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      # histograma de latência por rota, para calcular p95/p99 no Grafana
      percentiles-histogram:
        http.server.requests: true

pma:
  # Admin inicial criado na subida (AdminBootstrap). Vazio = não cria.
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
